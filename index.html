    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>

    <!-- PWA Manifest dynamique - charge les icônes depuis localStorage avant React -->
    <script>
      (function() {
        try {
          // Charger le manifest depuis localStorage
          var storedManifest = localStorage.getItem('pwaManifest');
          if (storedManifest) {
            var manifest = JSON.parse(storedManifest);
            // Créer un blob URL pour le manifest
            var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            // Mettre à jour le lien manifest
            var link = document.querySelector('link[rel="manifest"]');
            if (link) {
              link.href = url;
            }
            // Mettre à jour le titre
            if (manifest.name) {
              document.title = manifest.name;
            }
            console.log('✅ PWA Manifest chargé depuis localStorage');
          }
          
          // Charger le favicon depuis localStorage / companySettings
          var FAVICON_DEFAULT = '/favicon.png?v=20260219';
          var normalizeFavicon = function(v) {
            if (!v) return FAVICON_DEFAULT;
            v = String(v).trim();
            if (!v) return FAVICON_DEFAULT;
            if (v.indexOf('favicon.ico') !== -1) return FAVICON_DEFAULT;
            // Reject blob: URLs (stale from previous sessions)
            if (v.indexOf('blob:') === 0) return FAVICON_DEFAULT;
            return v;
          };

          var chosenFavicon = null;
          var customFavicon = localStorage.getItem('customFavicon');
          if (customFavicon) {
            chosenFavicon = customFavicon;
          } else {
            var companySettings = localStorage.getItem('companySettings');
            if (companySettings) {
              try {
                var settings = JSON.parse(companySettings);
                if (settings && settings.favicon) chosenFavicon = settings.favicon;
              } catch (e) {}
            }
          }

          chosenFavicon = normalizeFavicon(chosenFavicon);
          
          // Update ALL favicon link tags
          var faviconLinks = document.querySelectorAll("link[rel*='icon']");
          for (var i = 0; i < faviconLinks.length; i++) {
            faviconLinks[i].href = chosenFavicon;
          }

          // Persist migration
          try {
            localStorage.setItem('customFavicon', chosenFavicon);
            var cs = localStorage.getItem('companySettings');
            if (cs) {
              var s = JSON.parse(cs);
              if (s && s.favicon && (String(s.favicon).indexOf('favicon.ico') !== -1 || String(s.favicon).indexOf('blob:') === 0)) {
                s.favicon = chosenFavicon;
                localStorage.setItem('companySettings', JSON.stringify(s));
              }
            }
          } catch (e) {}

          console.log('✅ Favicon initial chargé:', chosenFavicon);

        } catch (e) {
          console.log('PWA Manifest: utilisation du manifest par défaut');
        }
      })();
    </script>
    
    <!-- PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Always try to update existing registrations to avoid stale caches
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.update().catch(() => {})));
            
            const registration = await navigator.serviceWorker.register('/sw.js');
            console.log('SW registered: ', registration);
          } catch (registrationError) {
            console.log('SW registration failed: ', registrationError);
          }
        });
      }
    </script>
